name: AHD build diagnosis

on:
  push:
    branches:
      - feat/hct-ahd-pcs-volume-neutral

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Run AHD regression tests
        run: pnpm run test:hct
      - name: Compile Next.js
        run: pnpm run build
