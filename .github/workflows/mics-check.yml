name: MICS drainage UI and hydraulic regression

on:
  push:
    branches:
      - feat/mics-drainage-simplified-ui
  pull_request:
    paths:
      - "components/mics-drainage-calculator.tsx"
      - "lib/mics-hydraulics.ts"
      - "tests/mics-hydraulics.test.mjs"
      - "package.json"
      - "tsconfig.mics.json"
      - ".github/workflows/mics-check.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Run MICS hydraulic regression tests
        run: pnpm run test:mics
      - name: Scoped MICS TypeScript check (legacy app has unrelated type errors)
        run: pnpm exec tsc --noEmit --project tsconfig.mics.json
      - name: Next.js production build
        run: pnpm run build
